<!DOCTYPE html>
<html>
<head>
    <title>raw data pie</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="../css/style.css">
        <link rel="stylesheet" type="text/css" href="../css/font-awesome.min.css">
        <link rel="stylesheet" type="text/css" href="../css/buttons.css">
</head>
<body>
    <div id="germline_pie" style="width: 840px; height: 350px; text-align: center; margin: auto"></div>
    <form style="text-align: center;">
        <label id='lblSelect'>
        <select id="selectPointOfInterest" style="margin: 0; padding: 1%" onchange="glmpieShow(this.options[this.options.selectedIndex].innerHTML);">
            <option>T2_3MM_13C</option>
				<option>TAPS_2_10_R2</option>
        </select>
        </label>&nbsp;&nbsp;
        <button type="button" id="pageUp" class="button button-normal button-border button-circle">
            <i class="icon-circle-arrow-up"></i>
        </button>
        <button type="button" id="pageDown" class="button button-normal button-border button-circle">
            <i class="icon-circle-arrow-down"></i>
        </button>
    </form>
        <script type="text/javascript" src="../js/jquery-1.4.2.min.js"></script>
    <script type="text/javascript" src="../js/echarts.min.js"></script>
    <script type="text/javascript" src="../js/macarons.js"></script>
    <script type="text/javascript">
        // change view function
        var glmpieShow = function(title1) {
		    data_dict = {'T2_3MM_13C': {'Splicing': 428, "5'UTR/3'UTR": 256, 'Downstream': 245582, 'upstream/downstream': 11516, 'Intergenic': 9146390, 'Others': 1617686, 'Intronic': 6456684, 'Exonic': 126051, 'Upstream': 219178, "3'UTR": 180476, "5'UTR": 34691}, 'TAPS_2_10_R2': {'Splicing': 47, "5'UTR/3'UTR": 1, 'Downstream': 5052, 'upstream/downstream': 233, 'Intergenic': 225256, 'Others': 33136, 'Intronic': 101074, 'Exonic': 2434, 'Upstream': 5173, "3'UTR": 2417, "5'UTR": 596}};
            data_dict1 = {'T2_3MM_13C': {'Exonic Non-synonymous': 45180, 'Exonic Stop gain': 488, 'Exonic Stop loss': 114, 'Exonic unknowns': 1410, 'Exonic Synonymous': 78859}, 'TAPS_2_10_R2': {'Exonic Non-synonymous': 1531, 'Exonic Stop gain': 64, 'Exonic Stop loss': 7, 'Exonic unknowns': 13, 'Exonic Synonymous': 819}};
            color_dict = {'Splicing': '#EFE331', 'Downstream': '#36AEAB', 'Others': '#F08300', 'upstream/downstream': '#6E3789', 'Intergenic': '#0C68AC', 'Upstream': '#666564', 'Intronic': '#D8456C', 'Exonic': '#539435'};
            color_dict1= {'Exonic Non-synonymous': '#0C68AC', 'Exonic Synonymous': '#539435', 'Exonic Stop loss': '#6E3789', 'Exonic unknowns': '#36AEAB', 'Exonic Stop gain': '#666564'};
            var classif = new Array();
            var data_if = new Array();
            var data_if2 = new Array();
            for (var key in data_dict[title1]){
                classif.push(key);
                data_if.push({"value": data_dict[title1][key], "name": key, itemStyle:{color:color_dict[key]}});
            };
            for (var key in data_dict1[title1]){
                classif.push(key);
                data_if2.push({"value": data_dict1[title1][key], "name": key, itemStyle:{color:color_dict1[key]}});
            };
            var myChart = echarts.init(document.getElementById('germline_pie'), 'macarons');
            var plot_option = {
                title : {
                    text: title1,
                    x:'center'
                },
                tooltip : {
                    trigger: 'item',
                    formatter: "{a} <br/>{b} : {c} ({d}%)"
                },
                legend: {
                    orient : 'vertical',
                    x : 'left',
                    data: classif,
                    type : 'scroll'
                },
                toolbox: {
                    show : true,
                    feature : {
                        mark : {show: true},
                        dataView : {show: true, readOnly: false},
                        magicType : {
                            show: true,
                            type: ['pie', 'funnel'],
                            option: {
                                funnel: {
                                    x: '25%',
                                    width: '50%',
                                    funnelAlign: 'left',
                                    max: 1548
                                }
                            }
                        },
                        restore : {show: true},
                        saveAsImage : {show: true}
                    }
                },
                calculable : true,
                series : [
                    {
                        name:'基因组不同区域上SNP数目',
                        type:'pie',
                        radius : '50%',
                        center: ['40%', '55%'],
                        data: data_if
                    },
                    {
                        name:'编码区不同类型SNP数目',
                        type:'pie',
                        radius : '20%',
                        center: ['80%', '65%'],
                        data: data_if2
                    }
                ]
            };
            myChart.setOption(plot_option);
        };
        glmpieShow("sample1");
        $(function() {
            $("#pageUp").click(function(){
                let downNode = this.nextElementSibling;
                let selectNode = this.parentNode.firstElementChild.firstElementChild;
                if (selectNode.selectedIndex == 0){
                    this.style.visibility = 'hidden';
                }else{
                    selectNode.selectedIndex = selectNode.selectedIndex - 1;
                    glmpieShow(selectNode.options[selectNode.selectedIndex].innerHTML);
                    downNode.style.visibility = 'visible';
                };
            });
            $("#pageDown").click(function(){
                let upNode = this.previousElementSibling;
                let selectNode = this.parentNode.firstElementChild.firstElementChild;
                if ( selectNode.selectedIndex == selectNode.options.length - 1){
                    this.style.visibility = 'hidden';
                }else{
                    selectNode.selectedIndex = selectNode.selectedIndex + 1;
                    glmpieShow(selectNode.options[selectNode.selectedIndex].innerHTML);
                    upNode.style.visibility = 'visible';
                }
            });
                        $("#selectPointOfInterest").change(function(){
                            let upNode = this.parentNode.nextElementSibling;
                            let downNode = upNode.nextElementSibling;
                            upNode.style.visibility = 'visible';
                            downNode.style.visibility = 'visible';
                        });
        });
    </script>
</body>
</html>
